const defaults={language:'system',theme:'system',alias:'我的 Chromecast',dock:false,startup:false,tool:'doubao',customApp:'',remoteMode:'toggle',targetMode:'toggle',shortcut:'option',gain:10,route:'vRemoteDr 2ch'};
const steps=['选择语音工具','连接遥控器','检查必要权限','设置说话方式','试着说一句话','按键配置','准备就绪'];
const sections=[['general','语音和音频','wave'],['remote','遥控器','remote'],['permissions','权限与诊断','shield'],['backup','设置','settings']];
let tokenSection='colors',tokenDemoToggle=true,tokenMotionPreview=false;
let settings={...defaults},view='setup',step=0,section='general',connected=false,permissions={bluetooth:'pending',accessibility:'pending',input:'pending'},stagedPermissions={...permissions},checkedAt='',testDone=false,testConfirmed=false,testRunning=false,testToolOpened=false,testFocused=false,troubleshootOpen=false,toneRunning=false,connectBusy=false,connectError=false,toastTimer,modalFocus=null,modalSource='';
try{let saved=JSON.parse(localStorage.getItem('vremoter-ui-prototype-v1'));if(saved){settings={...defaults,...validateSettings(saved.settings)};step=Math.max(0,Math.min(6,saved.step||0));if(saved.onboardingFlowVersion!==3&&step>=5)step=Math.min(6,step+1);connected=!!saved.connected;permissions={...permissions,...saved.permissions};stagedPermissions={...permissions};testDone=saved.testFlowVersion===2&&!!saved.testDone;testConfirmed=testDone&&!!saved.testConfirmed;testToolOpened=testDone;if(saved.testFlowVersion!==2&&step>=4)step=4;}}catch{}
function save(){try{localStorage.setItem('vremoter-ui-prototype-v1',JSON.stringify({settings,step,connected,permissions,testDone,testConfirmed,testFlowVersion:2,onboardingFlowVersion:3}))}catch{toast('浏览器不允许保存；本次演示仍可继续')}}
function validateSettings(o){if(!o||typeof o!=='object'||Array.isArray(o))throw Error('配置格式不正确');const r={};for(const k of Object.keys(defaults)){if(o[k]===undefined)continue;let v=o[k];if(['dock','startup'].includes(k)){if(typeof v!=='boolean')throw Error('开关值无效')}else if(k==='gain'){if(typeof v!=='number'||!Number.isFinite(v)||v<0||v>20)throw Error('增益需在 0–20 之间')}else{if(typeof v!=='string'||v.length>80)throw Error('文字值无效');let allowed={language:['system','zh-Hans','zh-Hant','en'],theme:['system','light','dark'],tool:['doubao','custom'],remoteMode:['hold','toggle'],targetMode:['hold','toggle'],shortcut:['option','command','control','shift','function'],route:['vRemoteDr 2ch','off']}[k];if(allowed&&!allowed.includes(v))throw Error('不支持的设置值')}r[k]=v}return r}
function applyTheme(){let t=settings.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):settings.theme;document.documentElement.dataset.theme=t;document.getElementById('quickTheme').innerHTML=icon(t==='dark'?'sun':'moon')}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(settings.theme==='system')applyTheme()});
function cycleTheme(){setThemePreference(document.documentElement.dataset.theme==='dark'?'light':'dark')}
function setSetting(k,v){settings[k]=v;if(['tool','customApp','remoteMode','targetMode','shortcut','route'].includes(k)){invalidateSpeechTest()}save();applyTheme();render();}
function info(text){return `<button class="info" aria-label="说明：${esc(text)}" aria-expanded="false" data-tip="${esc(text)}" onclick="this.setAttribute('aria-expanded',this.getAttribute('aria-expanded')!=='true')">i</button>`}
function toggle(k,label){return `<button class="toggle" role="switch" aria-label="${label}" aria-checked="${settings[k]}" onclick="setSetting('${k}',!settings.${k});toast('仅已更新本原型中的设置')"></button>`}
function toolName(){return settings.tool==='doubao'?'豆包输入法':(settings.customApp?'__vremoter_user_tool_label__':'其他语音工具')}
function keyName(){return {option:'⌥ Option',command:'⌘ Command',control:'⌃ Control',shift:'⇧ Shift',function:'Fn / 地球键'}[settings.shortcut]}
function toast(text){clearTimeout(toastTimer);document.getElementById('toastContainer').innerHTML=`<div class="toast">${icon('check')}<span>${esc(localizeText(text))}</span></div>`;toastTimer=setTimeout(()=>document.getElementById('toastContainer').innerHTML='',3500)}
function switchView(v){view=v;render();}
function gotoStep(i){if(i<=step){step=i;save();render()}else toast('完成当前步骤后，就可以继续')}
function goSection(s){section=s==='voice'?'general':s;view='settings';render();if(s==='voice')document.getElementById('voiceAudioSection')?.scrollIntoView?.({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});}
function canNext(){if(step===0)return settings.tool==='doubao'||!!settings.customApp;if(step===1)return connected;if(step===2)return Object.values(permissions).every(v=>v==='granted');if(step===3)return true;if(step===4)return settings.route!=='off'&&testDone&&testConfirmed;if(step===5)return true;if(step===6)return testDone&&testConfirmed;return true}
function nextStep(){if(!canNext())return;if(step===6){view='settings';section='general';toast('引导演示已完成，可以继续体验设置')}else step++;save();render()}
function previousStep(){if(step>0){step--;save();render()}}
function renderSidebar(){if(view==='tokens')return renderTokenSidebar();let setup=view==='setup';return `<div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><div class="sidebar-heading"><strong>${setup?'从这里开始':'偏好设置'}</strong><p>${setup?'几步设置，让声音触手可及':'让遥控器适合你的习惯'}</p></div><nav class="side-nav ${setup?'setup-sidebar':''}" aria-label="${setup?'引导步骤':'设置分类'}">${setup?steps.map((s,i)=>`<button class="nav-item ${i===step?'active':''} ${i<step?'done':''}" ${i===step?'aria-current="step"':''} onclick="gotoStep(${i})"><span class="nav-count">${i<step?icon('check'):i+1}</span><span class="step-label nav-label">${s}</span>${i<steps.length-1?'<span class="step-connector '+(i<step?'complete':'upcoming')+'" aria-hidden="true"></span>':''}</button>`).join(''):sections.map(([id,label,ico])=>`<button class="nav-item ${section===id?'active':''}" ${section===id?'aria-current="page"':''} onclick="goSection('${id}')">${icon(ico)}<span class="nav-label">${label}</span></button>`).join('')}</nav><div class="sidebar-bottom"><div class="side-device">${icon('remote')}<div class="grow"><strong data-i18n-skip>${esc(settings.alias||'我的 Chromecast')}</strong><p><i class="dot ${connected?'green':''}"></i>${connected?'已连接 · 模拟设备':'等待连接 · 模拟设备'}</p></div></div><div class="side-footer"><span>vRemoter</span><span>界面方案 01</span></div></div>`}
function render(){const previousLanguage=document.documentElement.lang;applyLanguage();document.getElementById('showTokens').classList.toggle('active',view==='tokens');document.getElementById('showTokens').setAttribute('aria-pressed',view==='tokens');document.getElementById('showSetup').classList.toggle('active',view==='setup');document.getElementById('showSettings').classList.toggle('active',view==='settings');document.getElementById('showSetup').setAttribute('aria-pressed',view==='setup');document.getElementById('showSettings').setAttribute('aria-pressed',view==='settings');document.getElementById('sidebar').innerHTML=localizeHTML(renderSidebar());document.getElementById('main').innerHTML=localizeHTML(view==='setup'?renderSetup():view==='tokens'?renderTokens():renderSettings());if(previousLanguage!==effectiveLanguage()&&modalSource)refreshModalLanguage();document.getElementById('brandIcon').innerHTML=icon('wave');document.getElementById('safetyIcon').innerHTML=icon('shield');applyTheme()}
function windowBar(title){return `<div class="windowbar"><div class="breadcrumb">vRemoter <span>/ &nbsp;${title}</span></div>${globalVoiceWidget()}</div>`}
function renderSetup(){const content=[setupTool,setupConnection,setupPermissions,setupVoice,setupAudio,setupKeys,setupReady][step]();return windowBar('首次使用')+`<div class="page">${content}</div><div class="step-footer"><span class="footer-note"><strong>${String(step+1).padStart(2,'0')}</strong> / ${String(steps.length).padStart(2,'0')} &nbsp; · &nbsp;进度在此浏览器保存</span><div class="flex">${step>0?'<button class="btn ghost" onclick="previousStep()">'+icon('back')+'上一步</button>':'<button class="btn ghost" onclick="switchView(\'settings\')">稍后设置</button>'}<button id="nextStepButton" class="btn primary" onclick="nextStep()" ${canNext()?'':'disabled'}>${step===6?'开始使用':'下一步'}${icon('arrow')}</button></div></div>`}
function hero(label='Chromecast 语音遥控器',desc='把声音，交给手边的这一枚'){return `<div class="remote-hero"><img src="${remoteImage}" alt="白色 Chromecast 语音遥控器正面"><div class="hero-label"><strong>${label}</strong><span>${desc}</span></div></div>`}
function setupTool(){return `<div class="intro-layout"><div><div class="eyebrow">01 / 先选好你的语音工具</div><h1>你准备在哪个<br>工具里说话？</h1><p class="sub small" style="margin-top:12px">vRemoter 传递遥控器的声音与按键，<br>文字识别由你选择的语音工具完成。</p>${toolCards()}<div class="help-note">${icon('info')}<span>稍后会一起确认录音快捷键。<br>你可以随时在设置中更换工具。</span></div></div>${hero()}</div>`}
function toolCards(){return `<div class="tool-list"><button class="tool-card ${settings.tool==='doubao'?'selected':''}" onclick="setSetting('tool','doubao')" aria-pressed="${settings.tool==='doubao'}"><span class="tool-avatar doubao">${icon('spark')}</span><span><strong>豆包输入法</strong><p>使用豆包的语音输入与识别</p></span><span class="radio"></span></button><button class="tool-card ${settings.tool==='custom'?'selected':''}" onclick="chooseCustom()" aria-pressed="${settings.tool==='custom'}"><span class="tool-avatar">${icon('app')}</span><span><strong ${settings.tool==='custom'&&settings.customApp?'data-i18n-skip':''}>${settings.tool==='custom'&&settings.customApp?esc(settings.customApp):'其他语音工具'}</strong><p>选择应用，并手动匹配录音快捷键</p></span><span class="radio"></span></button></div>${settings.tool==='custom'?'<p class="sticky-note">自定义工具的兼容性需要实际测试；这里仅演示选择过程。</p>':''}`}
function setupConnection(){return `<div class="page-head"><div class="eyebrow">02 / 连接手边的遥控器</div><h1>让 Mac 发现它</h1><p>当前只支持 Chromecast 语音遥控器。</p></div><div class="connection-layout"><div class="stack"><ol class="connection-guide"><li><b>1</b><span>打开 Mac 的蓝牙设置<span>在系统设置中完成设备配对。</span></span></li><li><b>2</b><span>让遥控器进入配对模式<span>同时按住返回键和主页键，等待指示灯闪烁。</span></span></li><li><b>3</b><span>选择 Chromecast 遥控器<span>返回 vRemoter，分别确认按键与语音通道。</span></span></li></ol><button class="btn" style="align-self:flex-start" onclick="simulateBluetoothSettings()">${icon('bluetooth')}打开蓝牙设置（演示）${icon('open')}</button><div class="card"><div class="setting-row"><div><div class="setting-label">${icon('remote')}Chromecast</div><p class="setting-desc">${connectBusy?'正在连接模拟设备…':connected?'按键与语音通道均已连接':connectError?'暂未找到设备，请检查配对状态':'等待遥控器完成配对'}</p></div>${connected?'<span class="pill success">'+icon('check')+'已连接</span>':'<button class="btn compact" onclick="connectRemote()" '+(connectBusy?'disabled':'')+'>'+icon(connectBusy?'refresh':'arrow',connectBusy?'spinner':'')+(connectBusy?'连接中':'模拟连接')+'</button>'}</div></div>${connectError?'<div class="inline-note error">'+icon('info')+'连接失败是演示状态。可以重新连接，已有设置会保留。</div>':''}<button class="text-link" style="text-align:left" onclick="connectError=true;connected=false;render();">演示暂时找不到设备</button></div>${hero('按键与声音，都要连上','蓝牙配对 ≠ 语音识别成功')}</div>`}
function connectRemote(){connectBusy=true;connectError=false;render();setTimeout(()=>{connected=true;connectBusy=false;if(globalVoiceState==='error')resetGlobalVoice();save();render();toast('模拟连接成功，未连接真实蓝牙设备')},800)}
function setupPermissions(){return `<div class="page-head"><div class="eyebrow">03 / 只开启需要的权限</div><h1>每一项，都说明白</h1><p>完成授权后，再回来检查一次。权限与设备连接是两件事。</p></div>${permissionCards()}<div class="between" style="margin-top:17px"><span class="small sub">${checkedAt?'上次检查：'+checkedAt:'尚未重新检查'}</span><button class="btn compact" onclick="checkPermissions()">${icon('refresh')}重新检查</button></div><div class="inline-note" style="margin-top:22px">${icon('shield')}<span>本轮只使用遥控器声音，不采集 Mac 麦克风。语音工具自身需要的麦克风权限，由该工具申请。</span></div>`}
const permissionMeta={bluetooth:['蓝牙','连接遥控器与接收语音','bluetooth'],accessibility:['辅助功能','让遥控器启动和停止语音输入','hand'],input:['输入监控','识别你按了哪个键','keyboard']};
function permissionCards(){return `<div class="card">${Object.entries(permissionMeta).map(([k,[label,desc,ico]])=>`<div class="permission-row"><div class="state-icon ${permissions[k]==='granted'?'ok':''}">${icon(ico)}</div><div><strong>${label}</strong><p>${desc}</p><div class="permission-status ${permissions[k]==='granted'?'ok':permissions[k]==='denied'?'no':''}">${permissions[k]==='granted'?'已授权 · 模拟结果':permissions[k]==='denied'?'未授权 · 需要你在系统中开启':'等待授权 · 模拟状态'}</div></div><div class="permission-actions"><button class="btn compact" onclick="permissionModal('${k}')">${permissions[k]==='granted'?'查看':permissions[k]==='denied'?'去设置':'申请权限'}</button><button class="toolbar-link" aria-label="打开${label}系统设置（演示）" title="打开系统设置（演示）" onclick="permissionSettings('${k}')">${icon('open')}</button></div></div>`).join('')}</div>`}
function checkPermissions(){permissions={...stagedPermissions};checkedAt=new Date().toLocaleTimeString(effectiveLanguage(),{hour:'2-digit',minute:'2-digit',hour12:false});save();render();toast(Object.values(permissions).every(v=>v==='granted')?'检查完成：模拟权限均已开启':'检查完成：仍有模拟权限未开启')}
function setupVoice(){return `<div class="page-head"><div class="eyebrow">04 / 两种设置，各有分工</div><h1>按你的习惯开始说话</h1><p>遥控器决定你怎么按，语音工具决定 vRemoter 怎么发送快捷键。</p></div>${remoteModes()}<div class="divider"></div>${targetSettings()}<div class="inline-note purple" style="margin-top:20px">${icon('info')}<span>两种模式可以不同。vRemoter 负责转换；语音工具的模式和快捷键必须与这里一致。</span></div>`}
function remoteModes(){return `<div class="section-label" style="margin-top:0"><span class="number-badge">1</span>手里的遥控器怎么按${info('这是实体语音键的操作方式。与电脑上语音工具的录音模式独立，可以任意组合。')}</div><div class="mode-options"><button class="mode-card ${settings.remoteMode==='toggle'?'selected':''}" onclick="setSetting('remoteMode','toggle')" aria-pressed="${settings.remoteMode==='toggle'}">${icon('tap')}<div><strong>按一下开始，再按一下停止</strong><p>放开手，也可以继续说话</p></div></button><button class="mode-card ${settings.remoteMode==='hold'?'selected':''}" onclick="setSetting('remoteMode','hold')" aria-pressed="${settings.remoteMode==='hold'}">${icon('hand')}<div><strong>按住说话，松开停止</strong><p>从按下到松开，就是一句话</p></div></button></div>`}
function targetSettings(){return `<div class="section-label" style="margin-top:0"><span class="number-badge">2</span>${esc(toolName())}怎么开始录音${info('打开语音工具设置，确认它使用按一下切换还是按住录音，再选择相同的模式。这里不会修改语音工具的设置。')}</div><div class="card"><div class="setting-row wrap-mobile"><div><div class="setting-label">软件里的录音方式</div><p class="setting-desc">请与语音工具内的设置保持一致</p></div><select aria-label="软件里的录音方式" onchange="setSetting('targetMode',this.value)"><option value="toggle" ${settings.targetMode==='toggle'?'selected':''}>按一下切换开始 / 停止</option><option value="hold" ${settings.targetMode==='hold'?'selected':''}>按住快捷键录音</option></select></div><div class="setting-row wrap-mobile"><div><div class="setting-label">录音快捷键${info('这里发送的按键，必须与语音工具的录音快捷键相同。例如工具设为 Fn，这里也需要选择 Fn。')}</div><p class="setting-desc">由 vRemoter 发送给语音工具</p></div>${shortcutSelect()}</div></div><div class="between" style="margin-top:13px;gap:10px"><span class="small sub">先核对工具中的设置，再回来继续</span><button class="toolbar-link" onclick="openTool()">打开${esc(toolName())}${icon('open')}</button></div>`}
function shortcutSelect(){return `<select aria-label="录音快捷键" onchange="setSetting('shortcut',this.value)">${[['option','⌥ Option'],['command','⌘ Command'],['control','⌃ Control'],['shift','⇧ Shift'],['function','Fn / 地球键']].map(([v,t])=>`<option value="${v}" ${settings.shortcut===v?'selected':''}>${t}</option>`).join('')}</select>`}
function routePath(){return `<div class="route-path"><div class="route-node"><div>${icon('remote')}</div><span>Chromecast 遥控器</span></div>${icon('arrow')}<div class="route-node active"><div>${icon('wave')}</div><span>${settings.route==='off'?'未选择音频设备':'vRemoteDr 2ch'}</span></div>${icon('arrow')}<div class="route-node"><div>${icon('app')}</div><span>${esc(toolName())}</span></div></div>`}
function routeSelect(){return `<select aria-label="声音发送到" onchange="setSetting('route',this.value)"><option value="vRemoteDr 2ch" ${settings.route==='vRemoteDr 2ch'?'selected':''}>vRemoteDr 2ch（模拟）</option><option value="off" ${settings.route==='off'?'selected':''}>关闭输出 / 未选择</option></select>`}
function meter(){return `<div class="meter ${testRunning?'running':''}" aria-label="模拟输入电平">${Array.from({length:48},(_,i)=>`<i style="--n:${i};--h:${Math.round(8+20*Math.abs(Math.sin(i*.8)))}"></i>`).join('')}</div>`}
function physicalVoiceKeyGlyph(){return `<span class="assistant-key-symbol" aria-hidden="true"><img src="${remoteImage}" alt=""></span>`}
function voiceKeyGuide(){return `<div class="voice-key-guide" aria-label="遥控器语音键位置说明"><div class="voice-key-photo"><img src="${remoteImage}" alt="Chromecast 遥控器中部，右侧黑色圆形按键为语音键"><span class="voice-key-spot" data-physical-key="voice" aria-hidden="true"></span></div><div class="voice-key-guide-copy"><div class="flex">${physicalVoiceKeyGlyph()}<strong>找到这枚黑色语音键</strong></div><p>带白色圆点图案，在返回键右侧。</p><p class="voice-key-instruction">${settings.remoteMode==='hold'?'按住这枚键说话，说完松开。':'按一下这枚键开始，说完再按一下。'}</p></div></div>`}
function setupAudio(){const busyElsewhere=globalVoiceState==='recording'&&globalVoiceSource!=='test';return `<div class="page-head speech-simple-head"><div class="eyebrow">05 / 试着说一句</div><h1>说一句，看看文字</h1></div><div class="speech-simple">${voiceKeyGuide()}<div class="speech-simple-input"><div class="between"><label for="speechTarget">${testDone?'看看刚才的文字':'试着说「你好，今天也从一句话开始」'}</label><button class="text-link" onclick="openTool(true)">${esc(toolName())}${icon('open')}</button></div><textarea id="speechTarget" class="text-input speech-target" aria-label="语音试用输入框（演示）" placeholder="${testRunning?'请说话，结束后示例文字会出现在这里…':'文字会出现在这里（演示）'}" ${testRunning?'readonly':''} onfocus="markSpeechFocus()" oninput="manualTestInput()">${testDone?'你好，今天也从一句话开始。':''}</textarea><p id="focusHint" class="speech-simple-hint">${testDone?'以上为原型预设的示例文字，并非真实识别结果。':'真实使用时，先打开语音工具，点一下要输入文字的位置。'}</p></div><div class="speech-simple-actions">${testDone?`<button id="speechConfirmButton" class="btn primary" onclick="confirmSpeechResult()" ${testConfirmed?'disabled':''}>${icon('check')}${testConfirmed?'已确认，可以继续':'文字已出现（模拟确认）'}</button><button class="btn ghost" onclick="speechTrialAction()">再试一次</button>`:`<button id="speechAction" class="btn primary" onclick="speechTrialAction()" ${busyElsewhere?'disabled':''}>${testRunning?icon('pause'):physicalVoiceKeyGlyph()}${testRunning?(settings.remoteMode==='hold'?'模拟松开，结束说话':'模拟再按一下，结束说话'):(settings.remoteMode==='hold'?'模拟按住说话':'模拟按一下，开始说话')}</button>`}</div></div><details class="diagnostics speech-simple-help" ${troubleshootOpen?'open':''} ontoggle="troubleshootOpen=this.open"><summary onclick="event.preventDefault();toggleSpeechHelp()">没有输入成功？</summary><div class="diagnostics-body"><ol class="diagnostics-list"><li>先打开${esc(toolName())}，确认光标在可输入文字的位置。</li><li>检查两边的录音快捷键与录音模式是否一致。</li><li>在语音工具中选择同一个虚拟麦克风设备。</li></ol>${routePath()}<div class="between" style="margin-top:14px;flex-wrap:wrap"><label class="small sub">声音发送到</label>${routeSelect()}</div><div class="between" style="margin-top:16px"><span class="tiny sub">输入电平 · 辅助诊断，不决定是否通过</span><span class="pill">演示数据</span></div>${meter()}<div class="between" style="margin-top:8px"><button class="text-link" onclick="goSection('permissions')">检查连接与权限</button><button class="text-link" onclick="goSection('voice')">核对语音设置</button></div>${settings.route==='off'?'<div class="inline-note error" style="margin-top:13px">'+icon('info')+'尚未选择音频设备，请先选择后重试。</div>':''}</div></details><p class="sticky-note speech-simple-disclaimer">原型只模拟工具就绪、说话与示例文字，不会打开真实应用或录音。</p>`}
function toggleSpeechHelp(){if(troubleshootOpen){troubleshootOpen=false;render()}else{showSpeechTroubleshooting()}}
function speechTrialAction(){if(settings.route==='off'){troubleshootOpen=true;render();return}if(globalVoiceState==='recording'&&globalVoiceSource!=='test'){toast('请先结束右上角正在进行的模拟说话');return}if(!testRunning){testToolOpened=true;testFocused=true}runSpeechTest();document.getElementById('speechTarget')?.focus?.()}
function invalidateSpeechTest(){if(globalVoiceSource==='test')resetGlobalVoice();testDone=false;testConfirmed=false;testRunning=false;testToolOpened=false;testFocused=false;troubleshootOpen=false}
function markSpeechFocus(){testFocused=true;const button=document.getElementById('speechAction');if(button)button.disabled=!testToolOpened||settings.route==='off'||(globalVoiceState==='recording'&&globalVoiceSource!=='test');const hint=document.getElementById('focusHint');if(hint&&!testDone&&!testRunning)hint.textContent=localizeText('输入位置已准备好 · 演示')}
function manualTestInput(){if(testConfirmed||testDone){testConfirmed=false;testDone=false;save();const next=document.getElementById('nextStepButton');if(next)next.disabled=true;const confirm=document.getElementById('speechConfirmButton');if(confirm){confirm.disabled=true;confirm.textContent=localizeText('请再试一次')}}const hint=document.getElementById('focusHint');if(hint)hint.textContent=localizeText('手动输入不算语音识别，请再试一次。')}
function runSpeechTest(){if(settings.route==='off'||!testToolOpened||!testFocused)return;if(testRunning){stopGlobalVoice()}else{startGlobalVoice('test')}}
function confirmSpeechResult(){if(!testDone||testRunning)return;testConfirmed=true;troubleshootOpen=false;save();render()}
function showSpeechTroubleshooting(){testConfirmed=false;troubleshootOpen=true;save();render()}
function sampleTone(){if(settings.route==='off')return;toneRunning=true;render();setTimeout(()=>{toneRunning=false;render();toast('已演示可选的声音连接诊断；不决定引导是否通过，也不表示识别成功')},1000)}
function setupReady(){return `<div class="ready"><div class="ready-mark">${icon('check')}</div><div class="eyebrow">07 / 设置完成</div><h1>下一句话，从手边开始</h1><p>引导流程已演示完成。<br>在真实应用中，仍需检查设备并完成实际语音测试。</p><div class="card ready-summary"><div class="setting-row"><span>使用的遥控器</span><strong data-i18n-skip>${esc(settings.alias||'我的 Chromecast')}</strong></div><div class="setting-row"><span>语音工具</span><strong>${esc(toolName())}</strong></div><div class="setting-row"><span>遥控器语音键</span><strong>${settings.remoteMode==='toggle'?'按一下开始，再按一下停止':'按住说话，松开停止'}</strong></div><div class="setting-row"><span>工具录音快捷键</span><strong>${esc(keyName())} · ${settings.targetMode==='toggle'?'按一下切换':'按住录音'}</strong></div></div><p class="sticky-note">可以到「设置 → 遥控器 → 按键配置」查看按键配置的预留位置。</p></div>`}
function renderSettings(){let label=sections.find(x=>x[0]===section)[1];return windowBar('设置')+`<div class="page settings-page"><div class="setting-header"><div><h1>${label}</h1><p>${{general:'从一次按键，到一句完整的话。',remote:'认出手边的这一枚，随时查看连接。',voice:'从一次按键，到一句完整的话。',permissions:'权限是否开启，连接是否正常，一眼看清。',backup:'管理外观、启动方式与配置备份。'}[section]}</p></div><span class="saved">${icon('check')}仅保存到本原型</span></div>${{general:settingsGeneral,remote:settingsRemote,voice:settingsVoice,permissions:settingsPermissions,backup:settingsBackup}[section]()}</div>`}
function themePreview(t,label){return `<button class="theme-option ${settings.theme===t?'active':''}" onclick="setSetting('theme','${t}')" aria-label="${label}" aria-pressed="${settings.theme===t}"><div class="theme-preview ${t}"><span class="mini-side"><i></i><i></i><i></i><i></i></span><span class="mini-main"><i></i><b></b><b></b></span></div><span class="theme-caption">${label}<span class="check-slot">${settings.theme===t?icon('check'):''}</span></span></button>`}
function themeSwitch(){const index=['light','dark','system'].indexOf(settings.theme);return `<div class="theme-switch" role="group" aria-label="外观主题" style="--selection:${index}"><span class="theme-switch-thumb" aria-hidden="true"></span>${[['light','浅色'],['dark','深色'],['system','跟随系统']].map(([id,label])=>`<button data-theme-choice="${id}" class="${settings.theme===id?'active':''}" aria-pressed="${settings.theme===id}" onclick="setThemePreference('${id}')">${label}</button>`).join('')}</div>`}
function setThemePreference(theme){if(!['light','dark','system'].includes(theme))return;settings.theme=theme;save();applyTheme();document.querySelectorAll('.theme-switch').forEach(el=>el.style.setProperty('--selection',['light','dark','system'].indexOf(theme)));document.querySelectorAll('[data-theme-choice]').forEach(el=>{let selected=el.getAttribute('data-theme-choice')===theme;el.classList.toggle('active',selected);el.setAttribute('aria-pressed',selected)});const label=document.getElementById('activeThemeLabel');if(label)label.textContent=localizeText(document.documentElement.dataset.theme==='dark'?'当前深色':'当前浅色')}
function settingsGeneral(){return `<section id="voiceAudioSection">${settingsVoice()}</section>`}
function languagePreferenceRow(){return `<div class="section-label" style="margin-top:0">语言</div><div class="card" style="margin-bottom:24px"><div class="setting-row wrap-mobile"><div><div class="setting-label">显示语言</div><p class="setting-desc">选择后立即生效；其他系统语言默认显示英语</p></div><select aria-label="显示语言" onchange="setSetting('language',this.value)"><option value="system" ${settings.language==='system'?'selected':''}>跟随系统</option><option value="zh-Hans" ${settings.language==='zh-Hans'?'selected':''} data-i18n-skip>简体中文</option><option value="zh-Hant" ${settings.language==='zh-Hant'?'selected':''} data-i18n-skip>繁體中文</option><option value="en" ${settings.language==='en'?'selected':''} data-i18n-skip>English</option></select></div></div>`}

function keyConfigurationPlaceholder(){return `<section class="key-placeholder" aria-label="按键配置占位"><div class="state-icon purple">${icon('keyboard')}</div><div><h3>按键配置展示位</h3><p>这里将沿用现有应用的按键配置展示，<br>完整布局在方案确认后补入。</p><div class="placeholder-gestures" aria-label="预留的操作类型"><span>单击</span><span>双击</span><span>长按</span></div><p class="placeholder-note">此处仅预留位置，不模拟另一套按键编辑器。现有按键配置不受影响。</p></div><span class="pill">待补充</span></section>`}

function settingsRemoteOverview(){return `<section class="card remote-overview" aria-label="遥控器概览"><div class="device-thumbnail remote-overview-photo"><img src="${remoteImage}" alt="Chromecast 语音遥控器"></div><div class="remote-overview-content"><div class="between remote-overview-title"><h2>Chromecast 语音遥控器</h2><span class="pill ${connected?'success':''}">${connectBusy?'连接中':connected?'已连接':'未连接'} · 模拟</span></div><div class="remote-name-row"><label class="setting-label" for="remoteAlias">显示名称${info('这是 vRemoter 内使用的显示别名，不会同步修改 macOS 蓝牙设置中的设备名称，也不代表绑定新的遥控器。')}</label><input id="remoteAlias" class="text-input" maxlength="30" aria-label="遥控器显示别名" value="${esc(settings.alias)}" onchange="setSetting('alias',this.value.trim()||'我的 Chromecast');toast('显示别名已保存在本原型')"></div><div class="status-list remote-overview-status"><span>${icon(connected?'check':'circle')}按键通道${connected?'已连接':'未连接'}</span><span>${icon(connected?'check':'circle')}语音通道${connected?'已连接':'未连接'}</span></div></div><div class="remote-overview-footer"><p>显示名称仅用于 vRemoter，系统蓝牙名称由 macOS 单独管理。</p><div class="remote-overview-actions"><button class="btn compact" onclick="simulateBluetoothSettings()">蓝牙设置${icon('open')}</button><button class="btn compact" onclick="connectRemote()" ${connectBusy?'disabled':''}>${icon('refresh',connectBusy?'spinner':'')}${connectBusy?'正在连接':connected?'重新连接':'连接遥控器'}</button></div></div></section>`}

function settingsVoice(){return `<div class="card"><div class="setting-row wrap-mobile"><div class="flex"><span class="tool-avatar ${settings.tool==='doubao'?'doubao':''}">${icon(settings.tool==='doubao'?'spark':'app')}</span><div><div class="setting-label">${esc(toolName())}</div><p class="setting-desc">文字识别由语音工具完成</p></div></div><div class="flex"><button class="btn compact" onclick="toolPicker()">更换工具</button><button class="btn compact" onclick="openTool()">打开${icon('open')}</button></div></div></div><div class="section-label">说话方式</div>${remoteModes()}<div style="margin-top:23px">${targetSettings()}</div><div class="section-label">声音连接</div><div class="card"><div class="setting-row wrap-mobile"><div><div class="setting-label">声音发送到${info('遥控器音频通过虚拟设备传给语音工具。请在语音工具中选择同一个输入设备；不会自动修改系统默认麦克风。')}</div><p class="setting-desc">语音工具也需要选择同一麦克风设备</p></div>${routeSelect()}</div><div class="setting-row" style="align-items:flex-start;flex-direction:column;gap:14px"><div class="between" style="width:100%"><div class="setting-label">遥控器音量${info('增益只改变遥控器音频的音量，不改变识别算法。原生范围为 0–20 倍，默认 10 倍。过高可能导致失真。')}</div><span class="tiny sub">默认 10×</span></div><div class="range-control" style="width:100%"><input aria-label="遥控器音量" type="range" min="0" max="20" step="0.5" value="${settings.gain}" oninput="settings.gain=+this.value;this.nextElementSibling.textContent=settings.gain.toFixed(1)+'×';save()"><output>${settings.gain.toFixed(1)}×</output></div></div><div class="setting-row"><span class="small sub">${settings.route==='off'?'未选择输出设备':'vRemoteDr 2ch · 模拟可用'}</span><div class="flex"><button class="text-link" onclick="toast('已刷新演示设备列表；未扫描真实设备')">刷新设备</button><button class="btn compact" onclick="sampleTone()" ${settings.route==='off'?'disabled':''}>${icon('play')}可选：测试音诊断</button></div></div></div><p class="sticky-note">测试音仅用于可选的声音连接排查，不是引导中的必做项。能否识别，以完整说话后确认的文字为准。</p>`}
function settingsPermissions(){return `${permissionCards()}<div class="between" style="margin-top:16px"><span class="tiny sub">${checkedAt?'上次检查：'+checkedAt:'尚未重新检查'}</span><button class="btn compact" onclick="checkPermissions()">${icon('refresh')}重新检查权限</button></div><div class="section-label">连接与会话</div><div class="split-detail"><div class="stat-card"><div class="flex">${icon('remote')}<span class="small sub">设备连接</span></div><p>按键通道 / 语音通道</p><strong>${connected?'均已连接':'等待连接'}</strong></div><div class="stat-card"><div class="flex">${icon('wave')}<span class="small sub">音频状态</span></div><p>本原型的示例会话</p><strong>${testRunning?'正在演示':testDone?'会话已结束':'待机'}</strong></div></div><div class="inline-note" style="margin-top:18px">${icon('shield')}<span>vRemoter 不采集 Mac 麦克风。语音工具的麦克风授权、虚拟音频设备安装，需要在本机单独完成。</span></div><div class="prototype-controls"><button class="btn compact" onclick="connected=false;errorGlobalVoice();save();render();toast('模拟已断开；设置仍保留')">演示设备断开</button><button class="btn compact" onclick="stopGlobalVoice();checkPermissions();toast('模拟音频已停止，并重新检查权限')">停止并重新检查</button></div>`}
function settingsBackup(){return `${appearanceAndStartupSettings()}<div class="section-label">配置备份</div><div class="card"><div class="card-heading"><div><p>备份应用设置。换电脑后，需要重新连接遥控器并授予权限。</p></div><span class="state-icon purple">${icon('folder')}</span></div><div class="setting-row"><div><div class="setting-label">导出设置</div><p class="setting-desc">保存外观、语音方式与本地显示别名</p></div><button class="btn compact" onclick="exportConfig()">${icon('download')}导出</button></div><div class="setting-row"><div><div class="setting-label">导入设置</div><p class="setting-desc">仅接受本原型导出的 JSON 文件</p></div><button class="btn compact" onclick="document.getElementById('importFile').click()">${icon('upload')}导入</button></div></div><details class="diagnostics" style="margin-top:17px"><summary>关于演示文件</summary><div class="diagnostics-body small sub">这里只保存当前网页中的演示设置。文件不能导入正式应用，也不会更改遥控器、系统权限或登录项。</div></details><div class="section-label">恢复与重来</div><div class="card"><div class="setting-row"><div><div class="setting-label">恢复默认设置</div><p class="setting-desc">只重置本原型；重要设置请先导出备份</p></div><button class="btn compact danger" onclick="confirmReset()">恢复默认</button></div><div class="setting-row"><div><div class="setting-label">从头体验首次引导</div><p class="setting-desc">保留外观与偏好，清空演示的连接和测试状态</p></div><button class="btn compact" onclick="restartSetup()">重新开始${icon('arrow')}</button></div></div>`}
function openModal(html){modalSource=html;modalFocus=document.activeElement;document.getElementById('overlay').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">${localizeHTML(html)}</section></div>`;document.querySelector('.modal button,.modal input')?.focus()}
function refreshModalLanguage(){const focused=document.activeElement?.id;const controls=[...document.querySelectorAll('#overlay input[id],#overlay textarea[id],#overlay select[id],#overlay button[id]')].map(el=>({id:el.id,value:el.value,checked:el.checked,onclick:el.onclick}));document.getElementById('overlay').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">${localizeHTML(modalSource)}</section></div>`;for(const control of controls){const el=document.getElementById(control.id);if(el){el.value=control.value;el.checked=control.checked;if(control.onclick)el.onclick=control.onclick}}if(focused)document.getElementById(focused)?.focus?.()}
function closeModal(){modalSource='';document.getElementById('overlay').innerHTML='';modalFocus?.focus()}
function permissionModal(k){let [name,desc,ico]=permissionMeta[k];openModal(`<div class="state-icon purple">${icon(ico)}</div><h2 id="modalTitle">${name}权限</h2><p>用途：${desc}。<br>这里模拟你前往系统设置后的操作，不会申请或更改真实权限。</p><div class="inline-note" style="margin-top:17px">${icon('info')}选择状态后，请返回页面点击「重新检查」。</div><div class="modal-actions"><button class="btn" onclick="stagedPermissions.${k}='denied';closeModal();toast('已演示未授权，请重新检查')">模拟未授权</button><button class="btn primary" onclick="stagedPermissions.${k}='granted';closeModal();toast('已演示授权，请重新检查')">模拟已授权</button></div>`)}
function permissionSettings(k){openModal(`<div class="state-icon purple">${icon(permissionMeta[k][2])}</div><h2 id="modalTitle">${permissionMeta[k][0]}的系统设置</h2><p>正式应用会打开相关系统设置页面。你需要自己确认是否授权，返回后点击「重新检查」。</p><p class="sticky-note">这是原型演示，不会打开设置或改变真实权限。</p><div class="modal-actions"><button class="btn primary" onclick="closeModal()">返回</button></div>`)}
function chooseCustom(){openModal(`<div class="state-icon purple">${icon('app')}</div><h2 id="modalTitle">选择其他语音工具</h2><p>正式应用会打开 macOS 应用选择器。<br>原型中可输入一个应用名称，体验后续配置。</p><div class="field"><label for="customName">语音应用名称</label><input id="customName" class="text-input" maxlength="40" placeholder="例如：我使用的语音工具" value="${esc(settings.customApp)}"></div><p class="sticky-note">自定义工具的实际兼容性需要测试。</p><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveCustom()">使用这个工具</button></div>`)}
function saveCustom(){let v=document.getElementById('customName').value.trim();if(!v){document.getElementById('customName').focus();return}settings.tool='custom';settings.customApp=v;invalidateSpeechTest();save();closeModal();render()}
function toolPicker(){openModal(`<div class="state-icon purple">${icon('app')}</div><h2 id="modalTitle">更换语音工具</h2><p>更换后，需要重新核对录音模式和快捷键。</p><div class="modal-actions"><button class="btn" onclick="closeModal();chooseCustom()">其他语音工具</button><button class="btn primary" onclick="closeModal();setSetting('tool','doubao')">豆包输入法</button></div>`)}
function openTool(forSpeech=false){openModal(`<div class="state-icon purple">${icon('open')}</div><h2 id="modalTitle">打开${esc(toolName())}</h2><p>正式应用会请求 macOS 打开所选工具。<br>请在工具内确认以下设置：</p><div class="card" style="margin-top:18px"><div class="setting-row"><span class="small sub">录音快捷键</span><span class="key">${esc(keyName())}</span></div><div class="setting-row"><span class="small sub">录音模式</span><strong class="small">${settings.targetMode==='toggle'?'按一下切换开始 / 停止':'按住快捷键录音'}</strong></div><div class="setting-row"><span class="small sub">麦克风</span><strong class="small">vRemoteDr 2ch</strong></div></div><p class="sticky-note">此处不会真实启动应用或修改工具设置。</p><div class="modal-actions"><button class="btn" onclick="closeModal();toast('模拟：未找到应用，请重新选择')">演示打开失败</button><button class="btn primary" onclick="finishToolOpen(${forSpeech})">模拟打开成功</button></div>`)}
function finishToolOpen(forSpeech){closeModal();if(forSpeech){if(globalVoiceSource==='test')resetGlobalVoice();testToolOpened=true;testFocused=false;testRunning=false;testDone=false;testConfirmed=false;save();render()}toast('已演示打开工具，未启动真实应用')}
function simulateBluetoothSettings(){openModal(`<div class="state-icon purple">${icon('bluetooth')}</div><h2 id="modalTitle">打开系统蓝牙设置</h2><p>在正式应用中，这里会打开「系统设置 → 蓝牙」。配对与系统设备名称在 macOS 中管理。</p><div class="inline-note" style="margin-top:18px">${icon('info')}原型不会打开系统设置或更改蓝牙名称。</div><div class="modal-actions"><button class="btn primary" onclick="closeModal()">知道了</button></div>`)}
function resumeSetup(){view='setup';render()}
function restartSetup(){resetGlobalVoice();step=0;connected=false;permissions={bluetooth:'pending',accessibility:'pending',input:'pending'};stagedPermissions={...permissions};checkedAt='';invalidateSpeechTest();view='setup';save();render()}
function confirmReset(){openModal(`<div class="state-icon">${icon('refresh')}</div><h2 id="modalTitle">恢复默认设置？</h2><p>将重置外观、语音偏好与显示别名。仅影响这个 HTML 原型，你的 Mac 与真实应用不会改变。</p><p class="sticky-note">当前偏好会被覆盖。如需保留，请先导出一份备份。</p><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn" onclick="exportConfig()">先导出备份</button><button class="btn primary" onclick="resetConfig()">恢复默认设置</button></div>`)}
function resetConfig(){resetGlobalVoice();settings={...defaults,language:settings.language};invalidateSpeechTest();save();closeModal();render();toast('已恢复原型默认设置')}
function exportConfig(){const data=JSON.stringify({type:'vremoter-html-prototype',version:1,settings},null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download=effectiveLanguage()==='en'?'vRemoter-demo-settings.json':effectiveLanguage()==='zh-Hant'?'vRemoter-演示設定.json':'vRemoter-演示设置.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('原型配置已导出，不含权限或配对记录')}
document.getElementById('importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>50000)throw Error('文件过大');let data=JSON.parse(await f.text());if(data.type!=='vremoter-html-prototype'||data.version!==1)throw Error('请选择这个网页导出的设置文件');let imported={...defaults,language:settings.language,...validateSettings(data.settings)};openModal(`<div class="state-icon purple">${icon('upload')}</div><h2 id="modalTitle">导入这份设置？</h2><p>将替换当前原型中的偏好设置，权限和连接状态保持不变。如需保留当前设置，请先导出备份。</p><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn" onclick="exportConfig()">先导出备份</button><button id="confirmImport" class="btn primary">导入配置</button></div>`);document.getElementById('confirmImport').onclick=()=>{resetGlobalVoice();settings=imported;invalidateSpeechTest();save();closeModal();render();toast('原型配置已导入')};}catch(err){toast('导入失败：'+err.message+'。原设置未改变')}e.target.value=''});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.querySelectorAll('.info[aria-expanded=true]').forEach(x=>x.setAttribute('aria-expanded','false'))}if(e.key==='Tab'&&document.querySelector('.modal')){let f=[...document.querySelectorAll('.modal button:not(:disabled),.modal input,.modal select')];if(!f.length)return;let first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
const tokenSections=[['colors','语义颜色','sun'],['type','字体与层级','keyboard'],['space','间距与尺寸','settings'],['shape','圆角与边框','app'],['effects','阴影与动效','spark'],['states','组件状态','hand']];
const colorTokens=[['--bg','桌面背景'],['--window','窗口背景'],['--sidebar','侧栏背景'],['--surface','卡片与浮层'],['--surface2','次级表面'],['--text','主要文字'],['--sub','次要文字'],['--muted','弱化文字'],['--line','分隔与描边'],['--accent','主要操作'],['--accent2','选中背景'],['--accentText','选中文字'],['--green','成功状态'],['--greenbg','成功背景'],['--red','错误状态'],['--redbg','错误背景'],['--control','控件背景'],['--focus','键盘焦点'],['--hero','展示底色'],['--texture','遥控器展示渐变']];
function tokenSource(){return document.getElementById('prototypeStyles').textContent}
function rootTokenValues(theme='light'){const source=tokenSource();function block(selector){const start=source.indexOf(selector+'{');if(start<0)return {};const body=source.slice(start+selector.length+1,source.indexOf('}',start));return Object.fromEntries([...body.matchAll(/(--[\w-]+):([^;]+)(?:;|$)/g)].map(m=>[m[1],m[2].trim()]))}return {...block(':root'),...(theme==='dark'?block(':root[data-theme="dark"]'):{})}}
function tokenValue(name,theme=document.documentElement.dataset.theme){return rootTokenValues(theme)[name]||''}
function tokenNames(prefix){return Object.keys(rootTokenValues()).filter(k=>k.startsWith(prefix)).sort((a,b)=>parseFloat(a.slice(prefix.length).replace('_','.'))-parseFloat(b.slice(prefix.length).replace('_','.')))}
function tokenCopyButton(name,theme='current',label='复制'){return `<button class="token-copy" aria-label="复制 ${esc(name)} ${theme==='light'?'浅色':theme==='dark'?'深色':''}" onclick="copyDesignToken('${name}','${theme}')">${label}</button>`}
function openTokenCopy(text){openModal(`<div class="state-icon purple">${icon('folder')}</div><h2 id="modalTitle">复制设计令牌</h2><p>内容已选中，按 ⌘C 或 Ctrl+C 即可复制。</p><textarea data-i18n-skip id="tokenCopyText" class="text-input token-code-area" readonly aria-label="待复制的设计令牌">${esc(text)}</textarea><div class="modal-actions"><button class="btn primary" onclick="closeModal()">完成</button></div>`);document.getElementById('tokenCopyText')?.select?.()}
async function copyDesignToken(name,theme='current'){const mode=theme==='current'?document.documentElement.dataset.theme:theme;const text=`${name}: ${tokenValue(name,mode)};`;if(typeof navigator!=='undefined'&&navigator.clipboard?.writeText){try{await navigator.clipboard.writeText(text);toast('设计令牌已复制');return}catch{}}openTokenCopy(text)}
function copyTokenCSS(){const light=rootTokenValues('light'),dark=rootTokenValues('dark');const base=Object.entries(light).map(([k,v])=>`  ${k}: ${v};`).join('\n');const overrides=Object.entries(dark).filter(([k,v])=>v!==light[k]).map(([k,v])=>`  ${k}: ${v};`).join('\n');openTokenCopy(`:root {\n${base}\n}\n\n:root[data-theme="dark"] {\n${overrides}\n}`)}
function goTokenSection(s){if(!tokenSections.some(x=>x[0]===s))return;tokenSection=s;view='tokens';render()}
function renderTokenSidebar(){return `<div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><div class="sidebar-heading"><strong>设计令牌</strong><p>界面与规范，共用一份样式</p></div><nav class="side-nav" aria-label="设计令牌分类">${tokenSections.map(([id,label,ico])=>`<button class="nav-item ${id===tokenSection?'active':''}" ${id===tokenSection?'aria-current="page"':''} onclick="goTokenSection('${id}')">${icon(ico)}<span class="nav-label">${label}</span></button>`).join('')}</nav><div class="sidebar-bottom"><div class="side-device">${icon('settings')}<div><strong>直接读取本页 CSS</strong><p>与引导、设置使用同一组变量</p></div></div><div class="side-footer"><span>vRemoter</span><span>设计规范</span></div></div>`}
function renderTokens(){const current=tokenSections.find(x=>x[0]===tokenSection);return windowBar('设计令牌')+`<div class="page settings-page token-page"><div class="setting-header"><div><div class="eyebrow">VREMOTER / DESIGN TOKENS</div><h1>${current[1]}</h1><p>本页数值直接来自原型的样式变量，不另存一份设计稿。</p></div><button class="btn compact" onclick="copyTokenCSS()">复制 CSS</button></div><div class="token-theme-toolbar"><span id="activeThemeLabel" class="small sub">${document.documentElement.dataset.theme==='dark'?'当前深色':'当前浅色'}</span>${themeSwitch()}</div>${{colors:tokenColors,type:tokenType,space:tokenSpace,shape:tokenShape,effects:tokenEffects,states:tokenStates}[tokenSection]()}</div>`}
function tokenColors(){return `<div class="token-color-grid">${colorTokens.map(([name,label])=>`<article class="card token-color-card"><div class="token-card-title"><strong>${label}</strong><code>${name}</code></div><div class="token-swatch-pair">${['light','dark'].map(mode=>`<div><div class="token-swatch" style="background:${esc(tokenValue(name,mode))}" aria-label="${label}${mode==='light'?'浅色':'深色'}色样"></div><div class="between"><span class="tiny sub">${mode==='light'?'浅色':'深色'}</span>${tokenCopyButton(name,mode)}</div><code class="token-value">${esc(tokenValue(name,mode))}</code></div>`).join('')}</div></article>`).join('')}</div><p class="sticky-note">成功与错误同时搭配文字或图标；不只依靠颜色表达状态。遥控器照片保留原始颜色。</p>`}
function tokenType(){return `<div class="card token-text-card"><div class="between"><strong>系统字体栈</strong>${tokenCopyButton('--font-sans')}</div><code class="token-value">${esc(tokenValue('--font-sans'))}</code><p class="sticky-note">macOS 优先使用系统字体与苹方；其他系统按顺序回退，不加载远程字体。</p></div><div class="section-label">字号 · 包含桌面与窄屏使用值</div><div class="token-type-grid">${tokenNames('--font-size-').map(name=>`<article class="card token-type-card"><div class="token-type-sample" style="font-size:var(${name})">Aa 你好，vRemoter</div><div class="between"><code>${name}</code>${tokenCopyButton(name)}</div><span class="tiny sub">${tokenValue(name)}</span></article>`).join('')}</div><div class="section-label">字重</div><div class="card token-list">${tokenNames('--weight-').map(name=>`<div class="token-list-row"><span style="font-weight:var(${name})">说话，从手边开始</span><code>${tokenValue(name)}</code>${tokenCopyButton(name)}</div>`).join('')}</div><div class="section-label">行高 · 无单位，随字号缩放</div><div class="token-chip-grid">${tokenNames('--leading-').map(name=>`<div class="token-chip"><code>${name}</code><strong>${tokenValue(name)}</strong>${tokenCopyButton(name)}</div>`).join('')}</div>`}
function tokenSpace(){const dims=[['--window-max','窗口最大宽度'],['--sidebar-wide','标准侧栏宽度'],['--sidebar-medium','中等窗口侧栏'],['--sidebar-narrow','紧凑窗口侧栏'],['--window-min-height','标准窗口最小高度'],['--header-height','标准标题栏高度'],['--control-min-height','默认按钮最小高度'],['--toggle-width','开关宽度'],['--toggle-height','开关高度'],['--theme-switch-width','外观切换默认宽度'],['--header-mobile-height','窄屏标题栏高度']];return `<div class="card token-list">${tokenNames('--space-').map(name=>`<div class="token-space-row"><code>${name}</code><div class="token-space-track"><span style="width:var(${name})"></span></div><strong>${tokenValue(name)}</strong>${tokenCopyButton(name)}</div>`).join('')}</div><p class="sticky-note">以上为界面中复用的基础间距；少数组件还保留局部光学微调，并非所有尺寸都强制取整。</p><div class="section-label">布局与控件尺寸</div><div class="card token-list">${dims.map(([name,label])=>`<div class="token-list-row"><span>${label}<code class="token-secondary-code">${name}</code></span><code>${tokenValue(name)}</code>${tokenCopyButton(name)}</div>`).join('')}</div><div class="inline-note" style="margin-top:18px">${icon('monitor')}<span>布局断点沿用当前原型：1195、940、660 px；大屏增强从 1400 px 开始。窄屏侧栏变为横向导航，引导步骤横向相连。</span></div>`}
function tokenShape(){return `<div class="token-radius-grid">${tokenNames('--radius-').map(name=>`<article class="card token-radius-card"><div class="token-radius-sample" style="border-radius:var(${name})"></div><code>${name}</code><div class="between"><strong>${tokenValue(name)}</strong>${tokenCopyButton(name)}</div></article>`).join('')}</div><div class="section-label">描边与键盘焦点</div><div class="card token-list">${[['--stroke-default','默认描边'],['--stroke-selected','选择卡片描边'],['--stroke-strong','强调描边'],['--focus-width','键盘焦点外框']].map(([name,label])=>`<div class="token-list-row"><span>${label}<code class="token-secondary-code">${name}</code></span><code>${tokenValue(name)}</code>${tokenCopyButton(name)}</div>`).join('')}</div><p class="sticky-note">描边颜色使用 --line，键盘焦点使用 --focus；它们在浅色与深色模式中分别定义。</p>`}
function tokenEffects(){return `<div class="token-effects-grid">${[['--shadow','主窗口'],['--shadow-segment','分段切换'],['--shadow-button','主要按钮'],['--shadow-modal','弹窗'],['--shadow-toast','操作提示'],['--shadow-tooltip','说明浮层'],['--shadow-toggle','开关滑块']].map(([name,label])=>`<article class="card token-effect-card"><div class="token-shadow-stage"><div style="box-shadow:var(${name})">${label}</div></div><div class="between"><code>${name}</code>${tokenCopyButton(name)}</div><code class="token-value">${name==='--shadow'?'浅色：'+esc(tokenValue(name,'light'))+'<br>深色：'+esc(tokenValue(name,'dark')):esc(tokenValue(name))}</code>${name==='--shadow'?'<p class="tiny sub">展示块随当前主题变化，以上列出两组值</p>':''}</article>`).join('')}</div><div class="section-label">动效时长</div><div class="card token-list">${[['--duration-button','按钮背景'],['--duration-hover','卡片反馈'],['--duration-toggle','开关滑块'],['--duration-meter','电平变化'],['--duration-normal','进入与主题切换'],['--duration-wave','示例波形'],['--duration-spin','加载旋转']].map(([name,label])=>`<div class="token-list-row"><span>${label}<code class="token-secondary-code">${name}</code></span><code>${tokenValue(name)}</code>${tokenCopyButton(name)}</div>`).join('')}</div><div class="inline-note" style="margin-top:18px">${icon('info')}<span>进入使用 ease，波形使用 ease-in-out，旋转使用 linear。开启系统「减少动态效果」时，关闭动画、过渡和顺滑滚动。</span></div>`}
function tokenStates(){return `<div class="card"><div class="card-heading"><strong>按钮</strong><span class="tiny sub">真实可交互样式</span></div><div class="token-state-samples"><div><button class="btn" onclick="toast('默认按钮示例')">默认</button><span>默认</span></div><div><button class="btn token-hover-example" onclick="toast('悬停按钮示例')">悬停</button><span>悬停示意</span></div><div><button class="btn primary" onclick="toast('主要按钮示例')">主要操作</button><span>主要操作</span></div><div><button class="btn token-focus-example" onclick="toast('键盘焦点示例')">焦点</button><span>键盘焦点示意</span></div><div><button class="btn" disabled>不可用</button><span>禁用 · ${tokenValue('--opacity-disabled')}</span></div></div></div><div class="section-label">选择与开关</div><div class="card"><div class="setting-row wrap-mobile"><div><div class="setting-label">外观分段切换</div><p class="setting-desc">可点击体验实际滑块过渡</p></div>${themeSwitch()}</div><div class="setting-row"><div><div class="setting-label">开关示例</div><p class="setting-desc">只改变这个示例，不更改应用设置</p></div><button class="toggle" role="switch" aria-label="设计令牌开关示例" aria-checked="${tokenDemoToggle}" onclick="tokenDemoToggle=!tokenDemoToggle;this.setAttribute('aria-checked',tokenDemoToggle)"></button></div></div><div class="section-label">输入与帮助</div><div class="card"><div class="setting-row wrap-mobile"><div><div class="setting-label">输入框${info('说明按钮支持鼠标悬停、点击展开与键盘焦点。')}</div><p class="setting-desc">按 Tab 可查看实际焦点轮廓</p></div><input class="text-input short" aria-label="设计令牌输入框示例" placeholder="在这里体验输入"></div></div><div class="section-label">状态反馈</div><div class="token-status-samples"><span class="pill">等待连接</span><span class="pill purple">当前步骤</span><span class="pill success">${icon('check')}已完成</span></div><div class="inline-note error" style="margin-top:15px">${icon('info')}连接未完成，请检查后重试 · 错误状态示例</div><div class="section-label">全局语音状态</div><div class="card"><div class="setting-row"><div><div class="setting-label">跨页面持续显示</div><p class="setting-desc">右上角可体验待机、说话中、结束与异常</p></div><button class="btn compact" onclick="voiceStateControls()">体验状态</button></div></div><p class="sticky-note">禁用状态保留文字，颜色状态搭配图标与说明。所有交互都保留可见键盘焦点。</p>`}

let globalVoiceState='idle',globalVoiceSource='demo',globalVoiceStartedAt=0,globalVoiceTimer=null;
function voiceDuration(){const seconds=globalVoiceState==='recording'?Math.max(0,Math.floor((Date.now()-globalVoiceStartedAt)/1000)):0;return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
function clearVoiceTimer(){if(globalVoiceTimer!==null){clearInterval(globalVoiceTimer);globalVoiceTimer=null}}
function updateVoiceDuration(){document.querySelectorAll('.global-voice-time').forEach(el=>el.textContent=voiceDuration())}
function resetGlobalVoice(){clearVoiceTimer();if(globalVoiceState==='recording'&&globalVoiceSource==='test'){testRunning=false;testDone=false;testConfirmed=false}globalVoiceState='idle';globalVoiceSource='demo';globalVoiceStartedAt=0}
function startGlobalVoice(source='demo'){if(globalVoiceState==='recording'){toast('先结束当前模拟说话，再开始下一次');return}globalVoiceSource=source;globalVoiceState='recording';globalVoiceStartedAt=Date.now();if(source==='test'){testRunning=true;testDone=false;testConfirmed=false}clearVoiceTimer();globalVoiceTimer=setInterval(updateVoiceDuration,1000);save();render()}
function stopGlobalVoice(){if(globalVoiceState!=='recording')return;clearVoiceTimer();globalVoiceState='ended';if(globalVoiceSource==='test'){testRunning=false;testDone=true;testConfirmed=false;save()}render()}
function errorGlobalVoice(){clearVoiceTimer();if(globalVoiceSource==='test'){testRunning=false;testDone=false;testConfirmed=false;troubleshootOpen=true;save()}globalVoiceState='error';render()}
function menuBarIconPreview(){const receiving=globalVoiceState==='recording';const description=receiving?'菜单栏图标演示：正在接收语音，绿点亮起':'菜单栏图标演示：未接收语音，绿点熄灭';return `<span class="menubar-icon-preview" role="img" aria-label="${description}" title="${description}。这是 vRemoter 应用状态示意，不是 macOS 隐私指示灯。"><span class="menubar-icon-glyph">${icon('wave')}${receiving?'<i class="voice-active-dot" aria-hidden="true"></i>':''}</span><small>菜单栏</small></span>`}
function globalVoiceWidget(){const labels={idle:'语音待机',recording:'正在说话',ended:'已结束说话',error:'连接异常'};return `<div class="global-voice-widget ${globalVoiceState}" role="group" aria-label="全局语音状态演示">${menuBarIconPreview()}<button class="global-voice-summary" aria-label="语音状态：${labels[globalVoiceState]}（演示），点击查看演示状态" onclick="voiceStateControls()">${globalVoiceState==='recording'?'<span class="global-voice-meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>':icon(globalVoiceState==='error'?'info':globalVoiceState==='ended'?'check':'mic')}<span class="global-voice-label">${labels[globalVoiceState]}<small>${globalVoiceState==='recording'?'<span class="global-voice-time">'+voiceDuration()+'</span> · ':''}演示</small></span></button>${globalVoiceState==='recording'?'<button class="global-voice-stop" aria-label="停止模拟说话" title="停止模拟说话" onclick="stopGlobalVoice()">'+icon('pause')+'</button>':''}</div>`}
function voiceStateControls(){openModal(`<div class="state-icon purple">${icon('mic')}</div><h2 id="modalTitle">全局语音状态</h2><p>右上角在引导、设置和设计令牌页面持续显示。这里可以体验状态变化，不会真实录音。</p><div class="voice-state-options"><button class="btn" onclick="closeModal();resetGlobalVoice();render()">${icon('mic')}待机</button><button class="btn ${globalVoiceState==='recording'?'':'primary'}" onclick="closeModal();${globalVoiceState==='recording'?'stopGlobalVoice()':"startGlobalVoice('demo')"}">${icon(globalVoiceState==='recording'?'pause':'wave')}${globalVoiceState==='recording'?'结束当前说话':'模拟开始说话'}</button><button class="btn danger" onclick="closeModal();errorGlobalVoice()">${icon('info')}模拟连接异常</button></div><p class="sticky-note">「已结束说话」只表示模拟会话结束，不等于外部语音工具已识别或输入成功。</p>${globalVoiceState==='error'?'<div class="modal-actions"><button class="btn" onclick="closeModal();goSection(\'permissions\')">查看排查</button><button class="btn primary" onclick="closeModal();resetGlobalVoice();render()">恢复待机</button></div>':'<div class="modal-actions"><button class="btn" onclick="closeModal()">关闭</button></div>'}`)}

音工具中选择同一个输入设备；不会自动修改系统默认麦克风。"},{"key":"ui_ca146ab1ff6f","zhHans":"说明：隐藏后仍可从菜单栏打开主窗口与设置。关闭主窗口不会退出应用。原型开关不会更改你的 Mac。","zhHant":"說明：隱藏後仍可從選單列開啟主視窗與設定。關閉主視窗不會結束應用程式。原型開關不會更改你的 Mac。","en":"Help: When the Dock icon is hidden, you can still open the main window and Settings from the menu bar. Closing the main window does not quit the app. This prototype’s toggle will not change your Mac.","source":"说明：隐藏后仍可从菜单栏打开主窗口与设置。关闭主窗口不会退出应用。原型开关不会更改你的 Mac。"},{"key":"ui_07a50c497b02","zhHans":"说明：调整遥控器声音的大小。太大会失真，建议先用默认的 10 倍。","zhHant":"說明：調整遙控器聲音的大小。太大會失真，建議先用預設的 10 倍。","en":"Info: Adjust the remote’s volume. Too high can distort the sound; start with the default 10×.","source":"说明：增益只改变遥控器音频的音量，不改变识别算法。原生范围为 0–20 倍，默认 10 倍。过高可能导致失真。"},{"key":"ui_2d41526cf805","zhHans":"说明：这里发送的按键，必须与语音工具的录音快捷键相同。例如工具设为 Fn，这里也需要选择 Fn。","zhHant":"說明：這裡傳送的按鍵，必須與語音工具的錄音快速鍵相同。例如工具設為 Fn，這裡也需要選擇 Fn。","en":"Help: The key sent here must match your voice tool’s recording shortcut. For example, if the tool uses Fn, select Fn here too.","source":"说明：这里发送的按键，必须与语音工具的录音快捷键相同。例如工具设为 Fn，这里也需要选择 Fn。"},{"key":"ui_10b2dc67f96b","zhHans":"说明：这是 vRemoter 内使用的显示别名，不会同步修改 macOS 蓝牙设置中的设备名称，也不代表绑定新的遥控器。","zhHant":"說明：這是 vRemoter 內使用的顯示別名，不會同步修改 macOS 藍牙設定中的裝置名稱，也不代表綁定新的遙控器。","en":"Help: This display name is used only in vRemoter. It won’t rename the device in macOS Bluetooth settings or pair a new remote.","source":"说明：这是 vRemoter 内使用的显示别名，不会同步修改 macOS 蓝牙设置中的设备名称，也不代表绑定新的遥控器。"},{"key":"ui_60430a2546f5","zhHans":"说明：这是实体语音键的操作方式。与电脑上语音工具的录音模式独立，可以任意组合。","zhHant":"說明：這是實體語音鍵的操作方式。與電腦上語音工具的錄音模式獨立，可以任意組合。","en":"Help: This controls how you use the physical voice button. It is independent of the voice tool’s recording mode on your computer, so you can combine them freely.","source":"说明：这是实体语音键的操作方式。与电脑上语音工具的录音模式独立，可以任意组合。"},{"key":"ui_3c7fc36cf230","zhHans":"说明按钮支持鼠标悬停、点击展开与键盘焦点。","zhHant":"說明按鈕支援滑鼠游標停留、點按展開與鍵盤焦點。","en":"Help buttons support hover, click to expand, and keyboard focus.","source":"说明按钮支持鼠标悬停、点击展开与键盘焦点。"},{"key": const I18N_BY_SOURCE=new Map(UI_CATALOG.map(row=>[row.source||row.zhHans,row]));
const I18N_SOURCES=[...I18N_BY_SOURCE.keys()].sort((a,b)=>b.length-a.length);
function resolveSystemLanguage(languages){const locale=String((Array.isArray(languages)?languages[0]:languages)||'en').replace(/_/g,'-').toLowerCase();if(locale.startsWith('zh')){if(/(?:^|-)hant(?:-|$)/.test(locale))return 'zh-Hant';if(/(?:^|-)hans(?:-|$)/.test(locale))return 'zh-Hans';return /(?:^|-)(?:tw|hk|mo)(?:-|$)/.test(locale)?'zh-Hant':'zh-Hans'}return 'en'}
function effectiveLanguage(){if(settings.language!=='system')return ['zh-Hans','zh-Hant','en'].includes(settings.language)?settings.language:'en';const locales=typeof navigator!=='undefined'?(navigator.languages?.length?navigator.languages:[navigator.language]):['en'];return resolveSystemLanguage(locales)}
function catalogText(row,language){return row[{ 'zh-Hans':'zhHans','zh-Hant':'zhHant',en:'en'}[language]]||row.en||row.zhHans}
function localizeText(value,language=effectiveLanguage()){const raw=String(value??'');if(!/[\u3400-\u9fff]/.test(raw))return raw;const normalized=raw.replace(/\s+/g,' ').trim();const exact=I18N_BY_SOURCE.get(normalized);if(exact)return (raw.match(/^\s*/)?.[0]||'')+catalogText(exact,language)+(raw.match(/\s*$/)?.[0]||'');let result=raw;for(const source of I18N_SOURCES){if(result.includes(source))result=result.split(source).join(catalogText(I18N_BY_SOURCE.get(source),language))}return result}
function decodeUIEntities(text){return text.replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')}
function localizeHTML(markup){const language=effectiveLanguage();let stack=[];let result=String(markup).split(/(<[^>]*>)/g).map(part=>{if(!part)return part;if(part[0]!=='<'){if(stack.some(x=>x.skip))return part;return esc(localizeText(decodeUIEntities(part),language)).replace(/&amp;nbsp;/g,'&nbsp;')}const close=part.match(/^<\/([a-z][\w-]*)/i);if(close){let at=stack.map(x=>x.tag).lastIndexOf(close[1].toLowerCase());if(at>=0)stack.splice(at);return part}const open=part.match(/^<([a-z][\w-]*)/i);if(!open)return part;const skip=stack.some(x=>x.skip)||/\bdata-i18n-skip(?:[\s=>]|$)/.test(part)||['script','style','code'].includes(open[1].toLowerCase());let out=skip?part:part.replace(/\b(aria-label|title|placeholder|data-tip|alt)="([^"]*)"/g,(_,name,value)=>`${name}="${esc(localizeText(decodeUIEntities(value),language))}"`);if(!/\/$/.test(part.slice(0,-1))&&!['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr'].includes(open[1].toLowerCase()))stack.push({tag:open[1].toLowerCase(),skip});return out}).join('');return result.replaceAll('__vremoter_user_tool_label__',esc(settings.customApp))}
function applyLanguage(){const locale=effectiveLanguage();document.documentElement.lang=locale;document.documentElement.dataset.language=locale;document.title='vRemoter';document.getElementById('prototypeNavigation').setAttribute('aria-label',localizeText('原型页面',locale));document.getElementById('showSetup').textContent=localizeText('首次引导',locale);document.getElementById('showSettings').textContent=localizeText('应用设置',locale);document.getElementById('showTokens').textContent=localizeText('设计令牌',locale);document.getElementById('prototypeTag').textContent=localizeText('界面体验原型',locale);document.getElementById('prototypeSafety').textContent=localizeText('设备、权限和说话过程均为演示，不会控制你的电脑或遥控器',locale);document.getElementById('quickTheme').setAttribute('aria-label',localizeText('切换浅色或深色',locale));document.getElementById('importFile').setAttribute('aria-label',localizeText('导入设置',locale))}
if(typeof window!=='undefined')window.addEventListener('languagechange',()=>{if(settings.language==='system')render()});
